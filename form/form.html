<html>
<head>
<title> this is form example </title>
</head>
<body>
<div style="width:400px;background-color: aqua;">
 <fieldset>  
    <legend align="center">Basic information</legend> 
<form method="post" action="xyz.php" enctype="multipart/form-data">
<label> user name </label>
<input type="text" name="user" value="Ranju" placeholder="Enter username" 
/>
<br><br>
<label> password </label>
<input type="password" name="pass" value="" placeholder="Enter your password" />
<br><br>
<label> Confirm password </label>
<input type="password" name="cpass" value="" placeholder="Re-Enter your password" />
<br><br>
<label> Email </label>
<input type="email" name="Email" value="" placeholder="Enter your email" />
<br><br>
<label> age </label>
<input type="number" min="18" max = "125" name="age"
 value="20" placeholder="Enter your age" />
<br><br>
<label> phone </label>
<input type="tel"  name="phone" pattern="[0-9]{5}-[0-9]{10}" maxlength="15" value="" placeholder="Enter your phone" />
<br><br>
<label>gender</label>
<input type="radio" name="gender" value="male" /> Male 
<input type="radio" name="gender" value="female"  checked /> Female
<br><br>
<label>interest</label>
<input type="checkbox" name="interest" value="study" checked /> Study 
<input type="checkbox" name="interest" value="dance" /> Dance
<input type="checkbox" name="interest" value="singing" checked /> singing 
<input type="checkbox" name="interest" value="swimming" /> swimming
<br><br>
<label>course</label>
<select name="course">              <!-- Comment you want to write  -->
    <option value="BCA" disabled>BCA</option>
    <option value="BBA">BBA</option>
    <option value="BBS">BBS</option>
    <option value="BE">BE</option>
    <option value="BIM">BIM</option>
</select>
<br><br>
<label>Address</label>
<textarea cols="30" rows="3"></textarea>
<br><br>
<label>Date of birth</label>
<input type="date" name="dob" value="" />
<br><br>
<label>Time of class</label>
<input type="time" name="classtime" value=""/>
<br><br>
<label>uniform color</label>
<input type="color" name="uniformcolor" value="#202020" />
<br><br>
<label>fee range</label>
<input type="range" name="feerange" min="10000" max="15000" value="12000" />
<br><br>
<label>upload file</label>
<input type="file" name="uploadfile" value="upload" />
<br><br>
<input type="hidden" name="id" value="13" />
<input type="url" name="url" />
<label>image</label>
<input type="image" name="myimage" src="C:\Users\ADMIN-PC\OneDrive\Pictures\Default.jpg" width="200px"  height="200px" />
<br><br>
<input type="button" name="btn1" value="button" />
<input type="submit" name="sub" value="Send data" />
<input type="reset" name="res" value="Clear data" />
</form>
</fieldset>
</div>
</body>
</html>
